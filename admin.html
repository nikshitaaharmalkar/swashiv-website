<!doctype html>
<html>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swashiv — Add Product</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  input, textarea, select, button { width: 100%; padding: 10px; margin-bottom: 12px; box-sizing: border-box; font-size: 15px; }
  button { background: #b5791f; color: #fff; border: none; cursor: pointer; font-weight: 600; border-radius: 4px; }
  label { font-size: 13px; color: #555; }
  #msg { margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
<h2>Add a Product</h2>

<label>Admin password</label>
<input type="password" id="password" placeholder="Password" />

<label>Product name</label>
<input type="text" id="name" placeholder="e.g. Floral Print Co-ord Set" />

<label>Category</label>
<select id="category">
  <option value="ethnic">Ethnic Co-ord</option>
  <option value="casual">Casual & Office</option>
</select>

<label>Description</label>
<textarea id="description" rows="2" placeholder="Short description"></textarea>

<label>Price (₹)</label>
<input type="number" id="price" placeholder="1299" />

<label>Image filename (optional)</label>
<input type="text" id="image" placeholder="e.g. photo-clothing-rack.jpg" />

<button id="submit">Add Product</button>
<div id="msg"></div>
